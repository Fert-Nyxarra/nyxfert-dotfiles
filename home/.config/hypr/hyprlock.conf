# ~/.config/hypr/hyprlock.conf
source = ~/.config/hypr/hyprlock-colors.conf   # генерирует matugen

general {
    hide_cursor = true
    ignore_empty_input = true
}

# фон: размытый скриншот рабочего стола
background {
    monitor =
    path = ~/Downloads/pinklook.png
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
}

# время
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 170
    halign = center
    valign = center
}

# дата
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $accent
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# поле пароля
input-field {
    monitor =
    size = 320, 54
    rounding = -1
    outline_thickness = 2
    outer_color = $accent
    inner_color = $card
    font_color = $fg
    font_family = JetBrainsMono Nerd Font

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    fade_on_empty = true
    placeholder_text = 󰌾  Пароль
    fail_text = $FAIL
    fail_color = $danger
    check_color = $accent
    capslock_color = $caps
    hide_input = false

    position = 0, -40
    halign = center
    valign = center
}
