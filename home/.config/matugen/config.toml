[config]

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/matugen-colors.conf"
post_hook = "pkill -USR1 kitty"
[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.qml"
output_path = "~/.config/quickshell/Colors.qml"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"
[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook = "sh -c 'hyprctl reload || true'"
[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch-template.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"
